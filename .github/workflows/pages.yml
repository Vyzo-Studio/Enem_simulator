name: Quality checks
on:
  push:
    branches: [main, feat-v13-subject-autocomplete]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bank and JavaScript
        run: node tests/qa.mjs
      - name: Check HTML bundle
        run: python3 scripts/build.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser regression
        run: python3 tests/v6_browser.py
      - name: Validate V8 scheduler, diagnostics and RLS schema
        run: node tests/v8_core.test.mjs
      - name: Check V8 deployment guardrails
        run: python3 tests/v8_integration_check.py
      - name: Browser regression V8 (simulated backend)
        run: python3 tests/browser_v8.py
      - name: Public questionnaire demo browser test
        run: python3 tests/browser_demo.py

      - name: Verify V9 diagnostic and scheduler
        run: node tests/v9_core.test.mjs
      - name: Browser regression V9 (local storage simulated)
        run: python3 tests/v9_browser.py

      - name: Verify V10 research source validation
        run: node tests/v10_research.test.mjs
      - name: Browser regression V10 research and manual fallback
        run: python3 tests/v10_browser.py
      - name: Browser regression V10 candidate selection (simulated service)
        run: python3 tests/v10_search_browser.py
      - name: Check Edge Function JavaScript syntax
        run: node --check --input-type=module < supabase/functions/academy-exam-research/index.ts

      - name: V13 searchable subjects browser regression
        run: python3 tests/v13_subjects_browser.py
