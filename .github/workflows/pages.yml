# GitHub Pages já está configurado para publicar diretamente da branch main.
# A publicação é feita automaticamente pelo workflow nativo "pages build and deployment".
# Esta rotina separada verifica a integridade sem tentar recriar o site Pages.
name: Quality checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate questions, answer keys, assets and source bundle
        run: node tests/qa.mjs
      - name: Check generated HTML matches source modules
        run: python3 scripts/build.py --check
